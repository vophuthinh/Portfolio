<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="msBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="msGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="msBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a4ef"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="420" fill="url(#msBg)" rx="12"/>
  <rect x="15" y="15" width="570" height="390" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" rx="8"/>
  <rect x="25" y="25" width="550" height="370" fill="none" stroke="url(#msBlue)" stroke-width="1" stroke-dasharray="4,4" rx="6" opacity="0.6"/>

  <!-- Microsoft 4-color squares -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="18" height="18" fill="#f25022"/>
    <rect x="22" y="0" width="18" height="18" fill="#7fba00"/>
    <rect x="0" y="22" width="18" height="18" fill="#00a4ef"/>
    <rect x="22" y="22" width="18" height="18" fill="#ffb900"/>
    <text x="52" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">Microsoft</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(430, 50)">
    <rect width="110" height="30" rx="15" fill="rgba(0,164,239,0.15)" stroke="#00a4ef" stroke-width="1"/>
    <text x="55" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CERTIFIED</text>
  </g>

  <!-- Certificate Heading -->
  <text x="60" y="150" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">PROFESSIONAL CREDENTIAL</text>
  <text x="60" y="190" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Implement Agentic AI &amp; Copilot</text>
  <text x="60" y="222" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Observe, Govern &amp; Secure AI Apps &amp; Agents</text>

  <!-- Recipient -->
  <text x="60" y="275" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Awarded to</text>
  <text x="60" y="305" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Vo Phu Thinh</text>

  <!-- Divider -->
  <line x1="60" y1="330" x2="540" y2="330" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Footer Info -->
  <g transform="translate(60, 360)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Skills: Agent 365 &bull; Frontier Firm &bull; Work IQ &bull; Microsoft Copilot</text>
    <text x="480" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="end">Microsoft Learn</text>
  </g>
</svg>
