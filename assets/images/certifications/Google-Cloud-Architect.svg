<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="gcpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="gcpLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="50%" stop-color="#34a853"/>
      <stop offset="100%" stop-color="#fbbc05"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="420" fill="url(#gcpBg)" rx="12"/>
  <rect x="15" y="15" width="570" height="390" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" rx="8"/>
  <rect x="25" y="25" width="550" height="370" fill="none" stroke="url(#gcpLine)" stroke-width="1" stroke-dasharray="5,5" rx="6" opacity="0.6"/>

  <!-- Google Cloud Logo & Brand -->
  <g transform="translate(60, 50)">
    <!-- Stylized Cloud icon -->
    <path d="M 28 24 C 28 16 34 10 42 10 C 48 10 54 14 56 20 C 58 19 60 18 63 18 C 70 18 75 23 75 30 C 75 37 70 42 63 42 L 28 42 C 20 42 15 37 15 30 C 15 24 20 19 26 19" fill="none" stroke="#4285f4" stroke-width="3" stroke-linecap="round"/>
    <text x="85" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Google Cloud</text>
  </g>

  <!-- Badge -->
  <g transform="translate(420, 50)">
    <rect width="120" height="30" rx="15" fill="rgba(66,133,244,0.15)" stroke="#4285f4" stroke-width="1"/>
    <text x="60" y="19" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CERTIFIED</text>
  </g>

  <!-- Certificate Heading -->
  <text x="60" y="145" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">GOOGLE CLOUD CERTIFIED</text>
  <text x="60" y="185" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Professional Cloud Architect</text>
  <text x="60" y="217" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Enterprise Cloud &amp; Scalable AI Infrastructure</text>

  <!-- Recipient -->
  <text x="60" y="270" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Issued to</text>
  <text x="60" y="300" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Vo Phu Thinh</text>

  <!-- Divider -->
  <line x1="60" y1="325" x2="540" y2="325" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Footer Info -->
  <g transform="translate(60, 355)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Cloud Architecture &#8226; Security &#8226; Distributed Systems</text>
    <text x="480" y="0" fill="#34a853" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="end">Google Cloud</text>
  </g>
</svg>
